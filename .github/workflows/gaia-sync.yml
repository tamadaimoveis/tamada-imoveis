name: Sincronizar Gaia -> Sanity

# Cron desativado em 02/10/2026: a Tamada não usa mais o Gaia como fonte,
# cadastro passou a ser 100% via CRM direto no Sanity. Mantido como
# workflow_dispatch manual (histórico/caso precise reimportar algo pontual),
# mas sem rodar sozinho — sem feed ativo, limpar-imoveis-saidos.ts marcaria
# em massa como inativo todo imóvel que só existe no Sanity por ter vindo
# do Gaia no passado.
on:
  workflow_dispatch: {}

concurrency:
  group: gaia-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gaia-import
    env:
      GAIA_XML_URL: ${{ secrets.GAIA_XML_URL }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Importa imóveis novos/atualizados do Gaia
        run: npx tsx scripts/import-gaia.ts

      - name: Marca como inativo quem saiu do feed
        run: npx tsx scripts/limpar-imoveis-saidos.ts

      # O ledger (gaia-import-ledger.json) fica versionado no repo, não em
      # cache do Actions: cache pode ser despejado (LRU) e a próxima rodada
      # nasceria sem saber quais das ~99mil fotos já foram enviadas — o que
      # já aconteceu na primeira tentativa (achou que tinha que subir tudo
      # de novo). Commitando de volta, o histórico nunca se perde.
      - name: Salva ledger atualizado
        run: |
          git config user.name "gaia-sync-bot"
          git config user.email "actions@github.com"
          git add gaia-import-ledger.json
          git diff --cached --quiet || git commit -m "Atualiza ledger do import Gaia [skip ci]"
          git push
